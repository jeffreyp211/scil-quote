  var k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.salt),iterations:P.iter,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  var gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.iv)},key,u8(P.ct));
  var html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return html;
}
document.getElementById("f").addEventListener("submit",async function(e){
  e.preventDefault();
  var b=document.getElementById("go"),er=document.getElementById("err"),pw=document.getElementById("pw").value;
  if(!pw)return;er.textContent="";b.disabled=true;b.textContent="Unlocking…";
  var html;
  try{html=await unlock(pw);}catch(x){
    b.disabled=false;b.textContent="Unlock";
    er.textContent=(x&&x.name==="OperationError")?"Incorrect password.":(x&&x.message)||"Could not unlock.";return;}
  document.open();document.write(html);document.close();
});
})();
